<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Navy to Slate Blue to Sage Green) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B2A" />
      <stop offset="40%" stop-color="#1B263B" />
      <stop offset="80%" stop-color="#415A77" />
      <stop offset="100%" stop-color="#55716E" />
    </linearGradient>

    <!-- Warm Sand Gold Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE5CF" />
      <stop offset="50%" stop-color="#D4C4A8" />
      <stop offset="100%" stop-color="#B8A484" />
    </linearGradient>

    <!-- Feather Main Gradient (Soft Ivory to Pure White) -->
    <linearGradient id="featherGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4C4A8" />
      <stop offset="25%" stop-color="#F4F1DE" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F1DE" />
    </linearGradient>

    <!-- Drop Shadow for high-contrast visibility -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="featherGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Squircle with AviTech Border -->
  <rect x="18" y="18" width="476" height="476" rx="114" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" stroke-opacity="0.92" filter="url(#shadow)" />
  
  <!-- Subtle Inner Accent Ring -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="none" stroke="#778D7A" stroke-width="3" stroke-opacity="0.35" />

  <!-- AviTech Pointed Feather Emblem -->
  <g transform="translate(256, 256) scale(0.60) translate(-262, -287)" filter="url(#featherGlow)">
    <path fill="url(#featherGrad)" d="M512 64c0-17.7-14.3-32-32-32c-35.3 0-69.5 8.7-100 25.1C341.3 77.9 303.4 104 271.7 135.7l-45.3 45.3c-15.6 15.6-28.7 33.3-39 52.3L153.2 201c-6.2-6.2-16.4-6.2-22.6 0s-6.2 16.4 0 22.6l34.2 34.2c-15.6 37.1-22.8 77.6-20.8 118.2L12 498c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l122.1-122.1c40.6 2 81.1-5.2 118.2-20.8l34.2 34.2c6.2 6.2 16.4 6.2 22.6 0s6.2-16.4 0-22.6L320.1 377.8c19-10.3 36.7-23.4 52.3-39l45.3-45.3c31.7-31.7 57.8-69.6 78.6-108.3C503.3 133.5 512 99.3 512 64z" />
  </g>
</svg>